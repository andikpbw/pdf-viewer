name: pdf_reader
description: A modern, high-performance, zero-dependency pure-Flutter PDF reader studio with vector PDF 1.7 rendering, full-text search, text selection, annotations, adaptive desktop/mobile UI, and reading themes.
version: 1.1.0
homepage: https://humanize.id
repository: https://github.com/andikpbw/pdf-viewer
issue_tracker: https://github.com/andikpbw/pdf-viewer/issues
documentation: https://humanize.id

topics:
  - pdf
  - pdf-viewer
  - document-viewer
  - reader
  - widget

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
